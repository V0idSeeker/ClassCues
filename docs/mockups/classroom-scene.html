<title>TeacherSim Classroom Scene</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Caveat:wght@500;700&family=JetBrains+Mono:wght@500&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: HUD strip, then the classroom as one drawn scene (first-person: you face the class), then a dialogue box beside the selected student's notebook and the lesson goals. Single committed look: a lit classroom inside a dark game frame. */
:root {
  color-scheme: dark;
  --frame: #1b2233; --frame-2: #262f45; --edge: #3a4664; --text: #eef1f8; --dim: #a3aec6;
  --gold: #ffc533; --gold-ink: #3b2a00; --go: #3fbf7f; --paper: #fdfdf6; --ink: #24304f; --red: #d2452f;
  --f-game: "Baloo 2", "Trebuchet MS", sans-serif; --f-body: "Nunito", system-ui, sans-serif;
  --f-hand: "Caveat", "Segoe Print", cursive; --f-code: "JetBrains Mono", Consolas, monospace;
}
body { background: var(--frame); color: var(--text); font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1560px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
h1, h2 { margin: 0; font-family: var(--f-game); text-wrap: balance; }
h1 { font-size: 22px; line-height: 1.1; }
h2 { font-size: 16px; }

.hud { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.hud .grow { flex: 1; min-width: 180px; }
.hud small { color: var(--dim); }
.pill { background: var(--frame-2); border: 2px solid var(--edge); border-radius: 999px; padding: 3px 12px; font-weight: 800; font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill.note { border-style: dashed; font-weight: 600; color: var(--dim); }
button { font: 800 14px var(--f-body); color: var(--text); background: var(--frame-2); border: 2px solid var(--edge); border-bottom-width: 4px; border-radius: 10px; padding: 6px 14px; cursor: pointer; }
button:hover { border-color: var(--gold); }
button:active { border-bottom-width: 2px; transform: translateY(2px); }
button.go { background: var(--go); border-color: #23804f; color: #062414; }
button.gold { background: var(--gold); border-color: #b98600; color: var(--gold-ink); }
button:focus-visible, textarea:focus-visible, .kid:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

.stage { border: 4px solid var(--edge); border-radius: 14px; overflow-x: auto; background: #cfe0ea; }
.stage svg { display: block; width: 100%; height: auto; }
#board-live { font: 700 38px/1.18 var(--f-hand); color: #f5f7f2; height: 372px; overflow: hidden; overflow-wrap: anywhere; }
#board-live .code { font: 500 23px/1.5 var(--f-code); color: #ffe08a; padding-left: 20px; white-space: pre-wrap; }
.kid { cursor: pointer; }
.kid:hover .plate { fill: #ffe9a6; }
.kid[aria-pressed="true"] .plate { fill: var(--gold); }
.eyes { transform-box: fill-box; transform-origin: center; }
@media (prefers-reduced-motion: no-preference) {
  .eyes { animation: blink 4.6s infinite; }
  .emote { animation: pop 1.6s ease-in-out infinite; }
}
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
@keyframes pop { 50% { transform: translateY(-4px); } }

.bigboard { background: #2f5d50; border: 12px solid #9a6a3c; border-radius: 10px; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
.bigboard label { font-size: 12px; font-weight: 800; color: #cfe6dc; letter-spacing: .04em; text-transform: uppercase; }
.bigboard textarea { background: transparent; border: 2px dashed #ffffff40; color: #f5f7f2; font-family: var(--f-hand); font-size: 34px; line-height: 1.25; min-height: 400px; }
.strip { display: flex; flex-wrap: wrap; gap: 8px; }
.mini { position: relative; width: 62px; text-align: center; font-size: 11px; font-weight: 800; color: #f5f7f2; }
.mini svg { display: block; width: 100%; height: auto; background: #cfe0ea; border: 3px solid #1b2233; border-radius: 10px; }
.mini.up svg { border-color: var(--gold); }
.mini.up::after { content: "✋"; position: absolute; top: -8px; right: -6px; font-size: 18px; }
.play { display: grid; grid-template-columns: minmax(0, 270px) minmax(0, 1fr) minmax(0, 290px); gap: 12px; align-items: start; }
.mid { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.sayrow { flex-direction: row; align-items: stretch; }
.sayrow textarea { flex: 1; min-width: 0; min-height: 52px; }
.stack { display: grid; grid-template-columns: auto auto; gap: 6px; align-content: start; }
.stage-in { position: relative; min-width: 520px; container-type: inline-size; }
#wall-board { position: absolute; left: 19.8%; top: 5.6%; width: 60.4%; height: 43.8%; min-height: 0; padding: 0; border: 0; border-radius: 0; resize: none;
  background: transparent; color: #f5f7f2; font: 700 3.15cqw/1.18 var(--f-hand); overflow: auto; }
#wall-board::placeholder { color: #ffffff80; }
#wall-board::selection { background: #ffe08a; color: #24304f; }
#wall-board:focus-visible { outline: 2px dashed #ffffffb0; outline-offset: 3px; }
.said { max-height: 96px; overflow-y: auto; }
@media (max-width: 1000px) { .play { grid-template-columns: minmax(0, 1fr); } .mid { order: -1; } }
@media (max-width: 520px) { .sayrow { flex-direction: column; } }
.box { background: var(--frame-2); border: 3px solid var(--edge); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }

.talk { display: grid; grid-template-columns: 68px minmax(0, 1fr); gap: 12px; align-items: center; }
.talk .pic { background: #cfe0ea; border: 3px solid var(--gold); border-radius: 12px; overflow: hidden; }
.talk .pic svg { display: block; width: 100%; height: auto; }
.talk .who { font-family: var(--f-game); font-size: 18px; color: var(--text); line-height: 1.1; }
.talk .line { font-size: 17px; overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0 6px; }
.state { white-space: nowrap; color: var(--text); background: var(--frame); border: 2px solid; font-size: 12px; font-weight: 800; border-radius: 999px; padding: 0 9px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.said { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--dim); }
.said b { color: var(--text); }
textarea { font: inherit; color: var(--text); background: var(--frame); border: 2px solid var(--edge); border-radius: 10px; padding: 8px 10px; resize: vertical; min-height: 58px; width: 100%; box-sizing: border-box; }

.paper { background: var(--paper) repeating-linear-gradient(transparent 0 27px, #b9cdea 27px 28px); background-position: 0 44px; color: var(--ink);
  border-radius: 6px; padding: 10px 14px 14px 46px; position: relative; box-shadow: 3px 4px 0 #0005; min-width: 0; }
.paper::before { content: ""; position: absolute; left: 34px; top: 0; bottom: 0; width: 2px; background: #e58a8a; }
.paper h2 { color: var(--ink); line-height: 34px; }
.paper .role { font-size: 12px; color: #5b6889; line-height: 1.2; display: block; }
.paper ul { list-style: none; margin: 6px 0 0; padding: 0; font-family: var(--f-hand); font-size: 22px; line-height: 28px; }
.paper li.wrong { color: var(--red); }
.paper li.wrong::after { content: "  ✗ wrong belief, not corrected yet"; font-family: var(--f-body); font-size: 11px; font-weight: 800; }

.goals { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.goals li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; font-size: 14px; }
.goals .n { font-weight: 800; font-variant-numeric: tabular-nums; }
.pips { grid-column: 1 / -1; display: flex; gap: 3px; }
.pips i { flex: 1; height: 8px; border-radius: 3px; background: var(--frame); border: 1px solid var(--edge); }
.pips i.on { background: var(--go); border-color: var(--go); }
.goals code { font-family: var(--f-code); font-size: 13px; }
</style>

<div class="wrap">
  <div class="hud">
    <div class="grow"><h1>Day 1 · Variables</h1><small>Intro to Python · Class 8B · click a student to read their notebook</small></div>
    <span class="pill">🕒 18:42 / 45:00</span>
    <span class="pill">AI requests 17 / 50</span>
    <span class="pill note">Mockup · sample data</span>
    <button class="gold" id="board-btn" aria-pressed="false">Go to the board</button>
    <button class="go" id="end-lesson">Ring the bell: quiz time</button>
  </div>

  <div class="play">
  <div class="side">
    <div class="box">
      <h2>Student</h2>
      <div class="talk">
        <div class="pic" id="pic"></div>
        <div><div class="who" id="who"></div><div class="chips" id="state"></div><div class="line" id="line"></div></div>
      </div>
      <div class="row">
        <button class="gold" id="next-hand">Next raised hand</button>
        <button id="speak">🔊 Hear it</button>
        <button id="call-on">Call on selected student</button>
        <button id="ask-class">Ask the class</button>
      </div>
      <div class="said" id="said"></div>
    </div>
    <div class="paper" id="nb" aria-live="polite"></div>
  </div>

  <div class="mid">
  <div class="stage" id="stage"><div class="stage-in"><svg id="scene" viewBox="0 0 1200 850" role="group" aria-label="Classroom with ten students at their desks"></svg>
    <textarea id="wall-board" spellcheck="false" placeholder="Click the board and write…" aria-label="The board. Click to write. Select words to erase or change them."></textarea></div></div>

  <div class="bigboard" id="bigboard" hidden>
    <label for="board-text">The board: everything here is visible to students and can be copied into their notebooks</label>
    <textarea id="board-text" spellcheck="false">Variable = a name for a value

    score = 10
    score = score + 1   # now 11

"=" means put into, not "equals"
</textarea>
    <div class="strip" id="strip" aria-label="Students, seen from the board"></div>
  </div>

  <div class="box sayrow">
    <textarea id="say" placeholder="Type what you say to the class…"></textarea>
    <div class="stack">
      <button class="go" id="send">Say it</button>
      <button id="to-board">Write it on the board</button>
      <button id="erase-sel">Erase selected words</button>
      <button id="wipe">Wipe the board</button>
    </div>
  </div>
  </div>

  <div class="side">
    <div class="box">
      <h2>Lesson goals · students who got it</h2>
      <ul class="goals" id="goals"></ul>
    </div>
  </div>
  </div>
</div>

<script>
const INK = "#2a2233", O = `stroke="${INK}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"`;
const S = [
  // back row
  { n: "Maya", e: "confused", hair: "long", hc: "#2b2330", skin: "#e8b98f", shirt: "#e77fa3", role: "Quiet, never asks", notes: ["variable is like a box with a name", "score = 10", "why does the box change??"] },
  { n: "Leo", e: "bored", hair: "spiky", hc: "#d9722b", skin: "#f6d3b3", shirt: "#f08a3c", role: "Class clown", notes: ["can name variable pizza"] },
  { n: "Yuki", e: "curious", hair: "bob", hc: "#1f1b26", skin: "#f1cfa5", shirt: "#d9534f", role: "Skeptic", notes: ["variable = named value", "= is assignment, right side first", "names: no spaces, no digit first"] },
  { n: "Sam", e: "neutral", hair: "curly", hc: "#2e2019", skin: "#8a5a3c", shirt: "#4fa66a", role: "Struggling", notes: ["variable is a name", "score is 10"] },
  { n: "Ben", e: "bored", hair: "cap", hc: "#7a5230", skin: "#f0c8a0", shirt: "#7f8aa3", role: "Drifts off", notes: ["variable = box", "something about score"] },
  // front row
  { n: "Aisha", e: "curious", hand: 1, hair: "hijab", hc: "#2f8f8a", skin: "#c98d62", shirt: "#7c62c9", role: "Eager, front row", say: "What happens to the old 10? Is it gone?", notes: ["variable = name for a value", "score = 10 puts 10 in score", "= means put into", "score + 1 makes it 11"] },
  { n: "Tom", e: "confused", hand: 1, hair: "short", hc: "#6b4424", skin: "#f3cfae", shirt: "#3f7fd1", glasses: 1, role: "Brings a wrong belief", say: "That line is wrong, right? Nothing can equal itself plus one.", notes: ["variable stores a value", "!= is like in math, both sides equal", "!score = score + 1 is a mistake"] },
  { n: "Nora", e: "happy", hair: "pigtails", hc: "#e3b341", skin: "#f6d3b3", shirt: "#f2c230", role: "Steady", notes: ["variable stores value", "= puts value in", "value can change: 10 then 11"] },
  { n: "Omar", e: "neutral", hair: "short", hc: "#1f1b26", skin: "#b97f52", shirt: "#2fa39a", role: "Copies the board", notes: ["Variable = a name for a value", "score = 10", "score = score + 1  # now 11", "= means put into"] },
  { n: "Lina", e: "happy", hair: "bun", hc: "#8a4b2a", skin: "#dba77c", shirt: "#b58be0", glasses: 1, role: "Likes examples", notes: ["variable like a labeled jar", "pizza is a valid name", "= put into, not equals"] }
];
const FRINGE = "M-31,-116 C-34,-156 34,-156 31,-116 C20,-136 -20,-136 -31,-116Z";
function hair(s) {
  const f = `fill="${s.hc}" ${O}`;
  switch (s.hair) {
    case "long": return [`<path d="M-35,-118 C-40,-164 40,-164 35,-118 L40,-58 L-40,-58Z" ${f}/>`, `<path d="${FRINGE}" ${f}/>`];
    case "bob": return [`<path d="M-36,-120 C-40,-164 40,-164 36,-120 L37,-88 L-37,-88Z" ${f}/>`, `<path d="M-31,-114 C-36,-158 36,-158 31,-114 L29,-128 L-29,-128Z" ${f}/>`];
    case "spiky": return ["", `<path d="M-32,-116 L-36,-140 L-26,-134 L-24,-156 L-12,-142 L-4,-164 L6,-143 L18,-160 L22,-138 L36,-144 L31,-116 C22,-132 -22,-132 -32,-116Z" ${f}/>`];
    case "curly": return ["", [[-31,-118],[31,-118],[-26,-132],[28,-132],[-14,-146],[17,-145],[2,-150]].map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="11" ${f}/>`).join("")];
    case "pigtails": return [`<ellipse cx="-42" cy="-100" rx="10" ry="20" ${f}/><ellipse cx="42" cy="-100" rx="10" ry="20" ${f}/>`, `<path d="${FRINGE}" ${f}/>`];

    case "cap": return [`<path d="M-32,-110 C-34,-140 34,-140 32,-110Z" ${f}/>`, `<path d="M-33,-126 C-33,-164 33,-164 33,-126Z" fill="${s.shirt}" ${O}/><path d="M-33,-126 L46,-126 Q54,-121 44,-119 L-33,-120Z" fill="${s.shirt}" ${O}/>`];
    case "hijab": return ["", `<path fill-rule="evenodd" d="M-38,-116 C-42,-168 42,-168 38,-116 C42,-84 34,-58 0,-52 C-34,-58 -42,-84 -38,-116Z M-23,-112 a23,28 0 1,0 46,0 a23,28 0 1,0 -46,0Z" ${f}/>`];
    default: return ["", `<path d="M-31,-116 C-36,-158 36,-158 31,-116 C26,-134 6,-140 -10,-136 C-20,-134 -27,-126 -31,-116Z" ${f}/>`];
  }
}
function faceParts(s) {
  const L = `fill="none" ${O}`;
  const brows = { confused: "M-18,-126 l11,-3 M7,-131 l11,3", curious: "M-18,-129 q6,-5 12,0 M6,-129 q6,-5 12,0", bored: "M-18,-124 h12 M6,-124 h12" }[s.e] || "M-18,-126 q6,-3 12,0 M6,-126 q6,-3 12,0";
  let eyes;
  if (s.e === "happy") eyes = `<path d="M-17,-112 q5,-7 10,0 M7,-112 q5,-7 10,0" ${L} stroke-width="2.5"/>`;
  else {
    const dx = s.e === "bored" ? 2.5 : 0, eye = x => `<ellipse cx="${x}" cy="-113" rx="6" ry="6.5" fill="#fff" ${O} stroke-width="1.5"/><circle cx="${x + dx}" cy="-112.5" r="3.2" fill="${INK}"/>`;
    const lid = x => `<rect x="${x - 7.5}" y="-121" width="15" height="8" fill="${s.skin}"/><path d="M${x - 6.5},-113 h13" ${L}/>`;

  return `<circle cx="-20" cy="-102" r="5" fill="#f2748a" opacity=".3"/><circle cx="20" cy="-102" r="5" fill="#f2748a" opacity=".3"/>
    <path d="${brows}" ${L} stroke-width="2.5"/><g class="eyes" style="animation-delay:${(s.n.length * 0.7) % 4}s">${eyes}</g>
    <path d="M-1,-107 q-3,6 2,7" ${L} stroke-width="1.5"/>${mouth}${specs}`;
}
function bust(s) {
  const [back, front] = hair(s), sk = `fill="${s.skin}" ${O}`;
  return `${back}<path d="M-42,0 Q-46,-52 -22,-60 L22,-60 Q46,-52 42,0Z" fill="${s.shirt}" ${O}/>
    <rect x="-9" y="-76" width="18" height="20" ${sk}/><ellipse cx="-30" cy="-112" rx="5" ry="7" ${sk}/><ellipse cx="30" cy="-112" rx="5" ry="7" ${sk}/>
    <path d="M-30,-118 C-30,-152 30,-152 30,-118 C30,-94 16,-74 0,-74 C-16,-74 -30,-94 -30,-118Z" ${sk}/>${faceParts(s)}${front}`;
}
// One state icon per student. A raised hand wins over the emotion.
const STATE = { confused: { i: "?", c: "#ffb98a", t: "Confused" }, curious: { i: "!", c: "#bfe0ff", t: "Curious" }, bored: { i: "z", c: "#d5d9e2", t: "Bored" },
  happy: { i: "♪", c: "#bff0c8", t: "Happy" }, neutral: { i: "…", c: "#ffffff", t: "Listening" } };
const state = s => s.hand ? { i: "✋", c: "#ffc533", b: "#24304f", t: "Hand raised" } : STATE[s.e];
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
function kid(s, i, x, y, k) {
  const sleeve = `fill="none" stroke="${s.shirt}" stroke-width="13" stroke-linecap="round"`, sk = `fill="${s.skin}" ${O}`;
  const arm = s.hand
    ? `<g>${still ? "" : '<animateTransform attributeName="transform" type="rotate" values="-4 36 -48;7 36 -48;-4 36 -48" dur="1.1s" repeatCount="indefinite"/>'}
        <path d="M36,-48 L48,-104" ${sleeve}/><path d="M48,-104 L52,-146" fill="none" stroke="${s.skin}" stroke-width="11" stroke-linecap="round"/><circle cx="53" cy="-154" r="9" ${sk}/></g>`
    : `<path d="M36,-46 Q46,-28 34,-20" ${sleeve}/>`;
  const st = state(s);
  const em = `<g class="emote"><circle cx="-46" cy="-160" r="16" fill="${st.b || st.c}" ${O}/><text x="-46" y="-153" text-anchor="middle" font-family="Baloo 2, sans-serif" font-weight="800" font-size="${s.hand ? 17 : 21}" fill="${INK}">${st.i}</text></g>`;
  return `<g class="kid" transform="translate(${x} ${y}) scale(${k})" data-i="${i}" role="button" tabindex="0" aria-pressed="false" aria-label="${s.n}, ${s.e}${s.hand ? ", hand raised" : ""}">
    ${bust(s)}<path d="M-36,-46 Q-46,-28 -34,-20" ${sleeve}/>${arm}
    <rect x="-64" y="-16" width="128" height="14" rx="3" fill="#e8c084" ${O}/><rect x="-58" y="-2" width="116" height="48" fill="#c9955c" ${O}/>
    <rect x="-16" y="-24" width="32" height="9" fill="#fff" ${O} stroke-width="1.5" transform="rotate(-4)"/>
    <circle cx="-34" cy="-18" r="8" ${sk}/>${s.hand ? "" : `<circle cx="34" cy="-18" r="8" ${sk}/>`}
    <rect class="plate" x="-32" y="10" width="64" height="22" rx="5" fill="#fff" ${O}/><text x="0" y="26" text-anchor="middle" font-family="Baloo 2, sans-serif" font-weight="800" font-size="15" fill="${INK}">${s.n}</text>${em}</g>`;
}
const room = `
  <rect width="1200" height="580" fill="#cfe0ea"/><rect y="580" width="1200" height="270" fill="#d9a56b"/>
  <path d="M0,650 H1200 M0,740 H1200 M150,580 V650 M520,580 V650 M900,580 V650 M330,650 V740 M720,650 V740 M1080,650 V740 M120,740 V850 M560,740 V850 M960,740 V850" stroke="#bd8850" stroke-width="2" fill="none"/>
  <rect y="568" width="1200" height="14" fill="#8fa9b8" ${O}/>
  <rect x="30" y="70" width="156" height="200" rx="6" fill="#fff" ${O}/><rect x="42" y="82" width="132" height="176" fill="#9fd4f5" ${O}/>
  <circle cx="148" cy="112" r="16" fill="#ffd95a"/><path transform="translate(-30 20) scale(.8)" d="M96,170 q14,-22 34,-8 q12,-18 32,-4 q22,-4 20,14 q-2,10 -16,10 h-62 q-14,-2 -8,-12Z" fill="#fff"/>
  <path d="M108,82 V258 M42,170 H174" stroke="#fff" stroke-width="8"/><path d="M108,82 V258 M42,170 H174" stroke="${INK}" stroke-width="1" opacity=".35"/>
  <rect x="206" y="24" width="788" height="420" rx="6" fill="#9a6a3c" ${O}/><rect x="220" y="38" width="760" height="392" fill="#2f5d50" ${O}/>
  <rect x="220" y="430" width="760" height="12" fill="#b98852" ${O}/><rect x="270" y="424" width="34" height="7" rx="3" fill="#fff"/><rect x="314" y="424" width="22" height="7" rx="3" fill="#ffd95a"/>
  <circle cx="1095" cy="110" r="38" fill="#fff" ${O} stroke-width="4"/><path d="M1095,110 V84 M1095,110 L1115,122" stroke="${INK}" stroke-width="4" stroke-linecap="round"/><circle cx="1095" cy="110" r="3" fill="${INK}"/>
  <rect x="1016" y="180" width="158" height="96" rx="4" fill="#ffe08a" ${O}/><text x="1095" y="214" text-anchor="middle" font-family="Baloo 2, sans-serif" font-weight="800" font-size="22" fill="${INK}">Python club</text>
  <text x="1095" y="250" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="${INK}">print("hello")</text>`;
const BX = [160, 380, 600, 820, 1040], FX = [140, 370, 600, 830, 1060];
const scene = document.getElementById("scene");
scene.innerHTML = room + S.map((s, i) => i < 5 ? kid(s, i, BX[i], 606, .8) : kid(s, i, FX[i - 5], 798, 1)).join("");
// One board text: editable right on the wall board (select words, delete or retype), and in the zoomed board view.
const wall = document.getElementById("wall-board"), big = document.getElementById("board-text");
function setBoard(v) { wall.value = big.value = v; }
wall.addEventListener("input", () => { big.value = wall.value; });
big.addEventListener("input", () => { wall.value = big.value; });
setBoard(big.value);
document.getElementById("erase-sel").onclick = () => { wall.setRangeText(""); big.value = wall.value; wall.focus(); };
document.getElementById("wipe").onclick = () => setBoard("");

const $ = id => document.getElementById(id);
let sel = 6, talk = 6;
function portrait(s) { return `<svg viewBox="-50 -172 100 112" aria-hidden="true">${bust(s)}</svg>`; }
function showTalk() { const s = S[talk]; $("pic").innerHTML = portrait(s); $("who").textContent = s.n;
  $("state").innerHTML = (s.hand ? [state(s), STATE[s.e]] : [STATE[s.e]]).map(st => `<span class="state" style="border-color:${st.c}">${st.i} ${st.t}</span>`).join(""); $("line").textContent = s.say ? "“" + s.say + "”" : "Not asking anything right now."; }
function showNb() {
  const s = S[sel];
  scene.querySelectorAll(".kid").forEach(k => k.setAttribute("aria-pressed", k.dataset.i == sel));
  $("nb").innerHTML = `<h2>${s.n}'s notebook</h2><span class="role">${s.role} · feeling ${s.e}</span><ul>${s.notes.map(t => t[0] === "!" ? `<li class="wrong">${t.slice(1)}</li>` : `<li>${t}</li>`).join("")}</ul>`;
}
function pick(e) { const k = e.target.closest(".kid"); if (k) { sel = talk = +k.dataset.i; showNb(); showTalk(); } }
scene.addEventListener("click", pick);
scene.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(e); } });
function said(label, text) { const d = document.createElement("div"), b = document.createElement("b"); b.textContent = label + " "; d.append(b, text); $("said").prepend(d); }
$("next-hand").onclick = () => { const hands = S.map((s, i) => s.hand ? i : -1).filter(i => i >= 0); talk = hands[(hands.indexOf(talk) + 1) % hands.length]; sel = talk; showTalk(); showNb(); };
$("strip").innerHTML = S.map(s => `<div class="mini${s.hand ? " up" : ""}">${portrait(s)}${s.n}</div>`).join("");
$("board-btn").onclick = e => {
  const open = $("bigboard").hidden;
  $("bigboard").hidden = !open; $("stage").hidden = open;
  e.target.textContent = open ? "Back to the class" : "Go to the board"; e.target.setAttribute("aria-pressed", open);
};
// Browser's built-in voices: each student gets their own voice (or pitch, when voices run out).
$("speak").onclick = () => {
  const synth = window.speechSynthesis, s = S[talk];
  if (!synth) return said("No voice here.", "This browser or frame has no speech support; open in Edge or Chrome.");
  const voices = synth.getVoices().filter(v => v.lang.startsWith("en")), u = new SpeechSynthesisUtterance(s.say || "");
  if (voices.length) u.voice = voices[talk % voices.length];
  u.pitch = 1.1 + (talk % 3) * 0.2; u.rate = 1.05;
  synth.cancel(); synth.speak(u);
};
$("call-on").onclick =() => said("You called on", S[sel].n);
$("ask-class").onclick = () => said("You asked the class a question.", "Hands go up…");
$("send").onclick = () => { const t = $("say").value.trim(); if (t) { said("You said:", t); $("say").value = ""; } };
$("to-board").onclick = () => { const t = $("say").value.trim(); if (t) { setBoard(big.value.trimEnd() + "\n" + t + "\n"); said("You wrote on the board:", t); $("say").value = ""; } };
$("end-lesson").onclick = () => said("Bell rings.", "Students start the quiz.");
$("goals").innerHTML = [["A variable stores a value under a name", 9], ["<code>=</code> assigns, it does not mean “equal”", 6], ["A variable's value can change", 5], ["Names are case-sensitive", 0], ["Values have types: int, str", 0]]
  .map(g => `<li><span>${g[0]}</span><span class="n">${g[1]}/10</span><span class="pips">${Array.from({ length: 10 }, (_, i) => `<i${i < g[1] ? ' class="on"' : ""}></i>`).join("")}</span></li>`).join("");
showTalk(); showNb();
</script>
